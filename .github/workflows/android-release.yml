name: Android Release Build

# Manual only. Every run consumes a versionCode (github.run_number) and
# produces an artifact meant for a deliberate Play Console upload, so building
# on every push to main only generated noise and skipped numbers.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: npm ci

      # release.jks / release.keystore.properties live at the project root
      # (gitignored, never committed) and are picked up automatically by
      # plugins/withReleaseSigning.js during `expo prebuild`.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > release.keystore.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.jks
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # google-services.json is gitignored, never committed (contains a
      # Firebase API key) and is restored here from a base64-encoded secret.
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      # app.json has no android.versionCode, so `expo prebuild` always
      # defaults it to 1 — every CI build ended up with the same versionCode,
      # which Play Console rejects as already used. github.run_number always
      # increases across runs of this workflow, so using it here guarantees
      # each build's versionCode is higher than the last without manual
      # bumping. (Re-running a failed run via "Re-run jobs" reuses the same
      # run_number — push a new commit or use workflow_dispatch instead if
      # that happens.)
      - name: Set Android versionCode
        run: |
          jq --argjson code "${{ github.run_number }}" '.expo.android.versionCode = $code' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: haberacik-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
