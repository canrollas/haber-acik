name: iOS Release Build

# Deliberately not triggered on every push to main like the Android workflow:
# a cold macOS build compiles all Pods from scratch and takes ~20-25 minutes,
# versus ~5 for Android. Run it when you actually intend to ship.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Runner images ship several Xcode versions and flip the default without
      # warning. Pin it so a runner image update can't silently change the
      # toolchain that produces a shipping build.
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Install dependencies
        run: npm ci

      # GoogleService-Info.plist is gitignored, never committed (contains a
      # Firebase API key) and is restored here from a base64-encoded secret.
      # app.json points ios.googleServicesFile at this path; the
      # @react-native-firebase/app plugin hard-fails prebuild if it is missing.
      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > GoogleService-Info.plist

      # app.config.js reads APPLE_TEAM_ID out of this gitignored file and feeds
      # it to Expo's built-in withDevelopmentTeam mod, which writes
      # DEVELOPMENT_TEAM into the pbxproj during prebuild. Without it the
      # archive step has no team and automatic signing cannot resolve.
      # Mirrors the Android job's release.keystore.properties restore.
      - name: Restore apns.credentials.properties
        run: |
          cat > apns.credentials.properties <<EOF
          APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          EOF

      # app.json has no ios.buildNumber, so `expo prebuild` always defaults
      # CFBundleVersion to 1 and App Store Connect rejects the second upload as
      # a duplicate. github.run_number always increases across runs, so each
      # build gets a higher number without manual bumping. Same trick as the
      # Android job's versionCode. (Re-running a failed run reuses the same
      # run_number — dispatch a fresh run instead if that happens.)
      - name: Set iOS build number
        run: |
          jq --arg build "${{ github.run_number }}" '.expo.ios.buildNumber = $build' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios

      # App Store Connect API key, used for "cloud signing": with this key
      # xcodebuild -allowProvisioningUpdates can create and download the
      # distribution certificate and App Store provisioning profile itself, so
      # no .p12 or .mobileprovision ever has to be stored as a secret.
      #
      # NOTE: this is NOT the APNs .p8. It comes from App Store Connect →
      # Users and Access → Integrations → App Store Connect API.
      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d \
            > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/HaberAk.xcworkspace \
            -scheme HaberAk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HaberAk.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # signingStyle automatic lets Xcode reuse whatever the archive step just
      # provisioned. method app-store-connect is the Xcode 15+ spelling of the
      # old "app-store" value.
      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HaberAk.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # The signing key is written outside the workspace, but remove it anyway
      # so it cannot end up in an artifact or a cached path.
      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: haberacik-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
